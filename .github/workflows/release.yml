name: Build Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.output }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            output: nativefs-linux-x64
          - os: ubuntu-22.04-arm
            output: nativefs-linux-arm64
          - os: macos-13
            output: nativefs-macos-x64
          - os: macos-14
            output: nativefs-macos-arm64
          - os: windows-2022
            output: nativefs-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev libglib2.0-dev pkg-config

      - name: Build
        working-directory: nativefs
        run: cargo build --release

      - name: Rename output (Unix)
        if: runner.os != 'Windows'
        run: cp nativefs/target/release/nativefs ${{ matrix.output }}

      - name: Rename output (Windows)
        if: runner.os == 'Windows'
        run: copy nativefs\target\release\nativefs.exe ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
	  prerelease: true
