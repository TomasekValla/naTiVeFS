name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: nativefs
        run: cargo build --release

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: nativefs/target/release/nativefs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
