name: Release

# Tag `vX.Y.Z` -> builds all 5 targets with their installers and packages, signs every file with minisign
# (free key, NOT an OS code-signing certificate) and publishes a GitHub release that the in-app updater reads.
# A push to the branch `release-test` runs everything except signing and publishing.
#
# One-time setup: `minisign -G`, put the public key into crates/tvfs-core/src/update.rs (UPDATE_PUBLIC_KEY) and add
# the repo secrets MINISIGN_KEY (contents of the secret key file) and MINISIGN_PASSWORD.

on:
  push:
    tags: ["v*"]
    branches: [release-test]

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Linux builds on an old glibc (2.34), so one binary runs on every supported distribution
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-24.04,     ext: tar.gz, image: "almalinux:9", appimage: x86_64 }
          - { name: linux-arm64,   os: ubuntu-24.04-arm, ext: tar.gz, image: "almalinux:9", appimage: aarch64 }
          - { name: windows-x64,   os: windows-latest,   ext: zip }
          - { name: windows-arm64, os: windows-11-arm,   ext: zip }
          - { name: macos-arm64,   os: macos-latest,     ext: tar.gz }
    steps:
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y --allowerasing gcc gcc-c++ make cmake git curl tar gzip file pkgconf-pkg-config \
            fontconfig-devel freetype-devel libxkbcommon-devel libxkbcommon-x11-devel wayland-devel libX11-devel \
            libxcb-devel mesa-libGL-devel mesa-libEGL-devel dbus-devel
          # libopus is built with CMake, which would install into lib64 here; audiopus_sys looks in lib
          echo 'set(CMAKE_INSTALL_LIBDIR lib CACHE PATH "")' > /tmp/libdir.cmake
          echo "CMAKE_TOOLCHAIN_FILE=/tmp/libdir.cmake" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: libmpv for the video player (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tools/fetch-libmpv.sh ${{ contains(matrix.name, 'arm64') && 'aarch64' || 'x86_64' }}

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: cargo build --release --locked -p nativefs-app -p nativefs-link -p nativefs-cli

      - name: Version
        shell: bash
        # VERSION_NUM: the numbers only (1.1.0 for 1.1.0-pre.1), where Windows and macOS allow nothing else
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION_NUM=${v%%-*}" >> "$GITHUB_ENV"

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        # Linux/macOS executables are lowercase: nativefs, nativefs-link, nativefs-cli
        run: |
          mkdir -p pkg out
          cp target/release/naTiVeFS pkg/nativefs
          cp target/release/naTiVeFS-link pkg/nativefs-link
          cp target/release/naTiVeFS-cli pkg/nativefs-cli
          cp LICENSE packaging/THIRD-PARTY.txt pkg/
          if [ "$RUNNER_OS" = Linux ]; then
            cp packaging/linux/nativefs.desktop pkg/
            cp assets/app-256.png pkg/nativefs.png
            tar -czf out/naTiVeFS-${{ matrix.name }}-portable.tar.gz -C pkg .
          fi

      - name: AppImage
        if: runner.os == 'Linux'
        # video and camera use the system's libmpv and ffmpeg; without them the rest of the app works
        run: |
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.appimage }}.AppImage"
          # digests of the 1.9.1 release assets
          case "${{ matrix.appimage }}" in
            x86_64) sum=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 ;;
            aarch64) sum=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158 ;;
          esac
          echo "$sum  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin AppDir/usr/share/licenses/nativefs AppDir/usr/share/metainfo
          cp packaging/linux/nativefs.metainfo.xml AppDir/usr/share/metainfo/nativefs.appdata.xml
          cp pkg/nativefs pkg/nativefs-link pkg/nativefs-cli AppDir/usr/bin/
          cp LICENSE packaging/THIRD-PARTY.txt AppDir/usr/share/licenses/nativefs/
          cp packaging/linux/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp packaging/linux/nativefs.desktop AppDir/
          cp assets/app-256.png AppDir/nativefs.png
          ARCH=${{ matrix.appimage }} ./appimagetool --appimage-extract-and-run --no-appstream AppDir out/naTiVeFS-${{ matrix.name }}.AppImage

      - name: dmg
        if: runner.os == 'macOS'
        run: |
          app=dmg/naTiVeFS.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp pkg/nativefs pkg/nativefs-link pkg/nativefs-cli "$app/MacOS/"
          cp assets/app.icns LICENSE packaging/THIRD-PARTY.txt "$app/Resources/"
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__VERSION_NUM__/$VERSION_NUM/g" packaging/macos/Info.plist > "$app/Info.plist"
          ln -s /Applications dmg/Applications
          hdiutil create -volname naTiVeFS -srcfolder dmg -ov -format UDZO out/naTiVeFS-macos-apple-silicon.dmg

      - name: Package and installer (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        # libmpv-2.dll: the video player (vendor/libmpv/README.md), taken from where fetch-libmpv.sh put it (where
        # build.rs copies it for `cargo run` depends on Cargo's build folder layout, which changed in Rust 1.100)
        run: |
          New-Item -ItemType Directory -Force stage, out | Out-Null
          $mpv = "vendor/libmpv/win-${{ contains(matrix.name, 'arm64') && 'aarch64' || 'x86_64' }}/libmpv-2.dll"
          Copy-Item target/release/naTiVeFS.exe, target/release/naTiVeFS-link.exe, target/release/naTiVeFS-cli.exe, $mpv, LICENSE, packaging/THIRD-PARTY.txt stage/
          # short names for the CLI: work from cmd and PowerShell once the install folder is on PATH
          foreach ($alias in "nativefscli", "nativecli") { Set-Content -Path "stage/$alias.cmd" -Value '@"%~dp0naTiVeFS-cli.exe" %*' -Encoding ascii }
          Compress-Archive -Path stage/* -DestinationPath out/naTiVeFS-${{ matrix.name }}-portable.zip
          # the Chocolatey feed sometimes answers 504: try again before giving up
          foreach ($try in 1..3) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          $src = (Resolve-Path stage).Path
          $setup = Join-Path (Resolve-Path out).Path "naTiVeFS-${{ matrix.name }}-setup.exe"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DVERSION=$env:VERSION" "/DVERSION_NUM=$env:VERSION_NUM" "/DSRC=$src" "/DOUT=$setup" packaging\windows\nativefs.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Test the installer (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "out/naTiVeFS-${{ matrix.name }}-setup.exe").Path
          $dir = "$env:LOCALAPPDATA\Programs\naTiVeFS"
          Start-Process $setup -ArgumentList "/S" -Wait
          foreach ($f in "naTiVeFS.exe", "naTiVeFS-link.exe", "naTiVeFS-cli.exe", "nativefscli.cmd", "nativecli.cmd", "libmpv-2.dll", "LICENSE", "THIRD-PARTY.txt", "uninstall.exe") {
            if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" }
          }
          if (-not ([Environment]::GetEnvironmentVariable("Path", "User") -split ";" -contains $dir)) { throw "install folder is not on the user PATH" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\naTiVeFS"
          if ((Get-ItemProperty $key).DisplayVersion -ne $env:VERSION) { throw "wrong version in the uninstall key" }
          # a silent update from the tray restarts the app hidden. The runner has no real desktop, so the app may exit
          # again at once: this watches the command lines while the installer runs instead of what is left afterwards
          $update = Start-Process $setup -ArgumentList "/S", "/UPDATE", "/HIDDEN" -PassThru
          $seen = @()
          $until = (Get-Date).AddSeconds(45)
          while ((Get-Date) -lt $until -and -not ($seen -like "*--minimized*")) {
            $seen += @(Get-CimInstance Win32_Process -Filter "Name='naTiVeFS.exe'" | ForEach-Object { $_.CommandLine })
            Start-Sleep -Milliseconds 100
          }
          $update.WaitForExit()
          if (-not ($seen -like "*--minimized*")) { throw "not restarted hidden: $($seen -join ' | ')" }
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S", "_?=$dir" -Wait
          # `_?=` keeps uninstall.exe running from this folder, so it and the folder itself stay in this test
          $left = Get-ChildItem $dir | Where-Object Name -ne "uninstall.exe"
          if ($left) { throw "left after uninstall: $($left.Name -join ', ')" }
          if (Test-Path $key) { throw "uninstall key left behind" }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -split ";" -contains $dir) { throw "install folder left on the user PATH" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: naTiVeFS-${{ matrix.name }}
          path: out/*

  # Linux packages from the portable archives (no secrets in this job)
  package:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Linux packages (.deb, .rpm, Arch)
        run: |
          curl -fsSL -o nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.41.0/nfpm_2.41.0_Linux_x86_64.tar.gz
          # from nfpm's checksums.txt of v2.41.0
          echo "2fec509cc508fd7688b03f1426747725e93e024ff3c94a7f02022a50ddaa6c04  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          export VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          for name in x64:amd64 arm64:arm64; do
            short=${name%%:*}
            export ARCH=${name##*:}
            rm -rf pkg && mkdir pkg
            tar -xzf "dist/naTiVeFS-linux-$short-portable.tar.gz" -C pkg
            ./nfpm package -f packaging/linux/nfpm.yaml -p deb -t "dist/naTiVeFS-linux-$short-debian-ubuntu.deb"
            ./nfpm package -f packaging/linux/nfpm.yaml -p rpm -t "dist/naTiVeFS-linux-$short-fedora-opensuse.rpm"
            ./nfpm package -f packaging/linux/nfpm.yaml -p archlinux -t "dist/naTiVeFS-linux-$short-arch.pkg.tar.zst"
          done
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: all-packages
          path: dist/*

  # The only job that sees the signing key: no checkout, no third-party action or tool, only the packages and the
  # distribution's minisign. It hands back the signatures alone.
  sign:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: all-packages
          path: dist

      - name: Sign everything with minisign
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
          # the signed comment names the file and the release version (tab separated): the app installs a file only
          # when it names that exact asset and a version newer than its own (no downgrade to an older signed build);
          # the install scripts check the file name
          for f in dist/naTiVeFS-*; do
            comment=$(printf 'timestamp:%s\tfile:%s\tversion:%s' "$(date +%s)" "$(basename "$f")" "$GITHUB_REF_NAME")
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "$comment"
          done
          rm -f "$RUNNER_TEMP/minisign.key"
          mkdir sigs && mv dist/*.minisig sigs/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signatures
          path: sigs/*

  # Publishes the packages and their signatures (no key here)
  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
          pattern: "{all-packages,signatures}"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
          # 0.x tags and tags with a suffix (v1.1.0-pre.1) are pre-releases: only the updater's pre-release channel
          # offers them, and the install scripts (releases/latest) never get them
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
