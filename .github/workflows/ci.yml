name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,     os: ubuntu-24.04 }
          - { name: linux-arm64,   os: ubuntu-24.04-arm }
          - { name: windows-x64,   os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
          - { name: macos-arm64,   os: macos-15 }
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev

      - name: libmpv for the video player (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash tools/fetch-libmpv.sh ${{ contains(matrix.name, 'arm64') && 'aarch64' || 'x86_64' }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --workspace --locked
      - run: cargo test --release --workspace --locked

      # Runnable binaries to try on the real OS: open the finished run on GitHub
      # and download them from the "Artifacts" section at the bottom.
      - name: Upload binaries (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: naTiVeFS-${{ matrix.name }}
          path: |
            target/release/naTiVeFS
            target/release/naTiVeFS-link
          retention-days: 14
      - name: Upload binaries (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: naTiVeFS-${{ matrix.name }}
          path: |
            target/release/naTiVeFS.exe
            target/release/naTiVeFS-link.exe
            target/release/libmpv-2.dll
          retention-days: 14
