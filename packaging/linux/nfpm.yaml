# nfpm builds the .deb, .rpm and Arch packages from one description (ARCH and VERSION come from the environment).
name: nativefs
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
maintainer: Tomas Valla <161061217+TomasekValla@users.noreply.github.com>
description: Native client for TVFS with a local video player, reader and audio player
homepage: https://github.com/TomasekValla/naTiVeFS
license: GPL-3.0-or-later
contents:
  - src: pkg/nativefs
    dst: /usr/bin/nativefs
    file_info: { mode: 0755 }
  - src: pkg/nativefs-link
    dst: /usr/bin/nativefs-link
    file_info: { mode: 0755 }
  - src: packaging/linux/nativefs.desktop
    dst: /usr/share/applications/nativefs.desktop
  - src: assets/app-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/nativefs.png
  - src: assets/app-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/nativefs.png
  - src: packaging/linux/nativefs.metainfo.xml
    dst: /usr/share/metainfo/nativefs.metainfo.xml
  - src: LICENSE
    dst: /usr/share/licenses/nativefs/LICENSE
  - src: packaging/THIRD-PARTY.txt
    dst: /usr/share/licenses/nativefs/THIRD-PARTY.txt
overrides:
  deb:
    depends: [libfontconfig1]
    recommends: [libmpv2, ffmpeg, "libasound2t64 | libasound2"]
  rpm:
    depends: [fontconfig]
    recommends: ["(mpv-libs or libmpv2)", ffmpeg, "(alsa-lib or libasound2)"]
  archlinux:
    # nfpm's Arch packager drops `recommends`, and these features should work out of the box
    depends: [fontconfig, mpv, ffmpeg, alsa-lib]
