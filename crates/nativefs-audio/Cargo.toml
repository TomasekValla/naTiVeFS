[package]
name = "nativefs-audio"
description = "Audio decoding, bit-perfect output (WASAPI exclusive, ALSA hw, CoreAudio) and DSP for naTiVeFS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
ebur128 = "0.1"
rustfft = "6"
symphonia = { version = "0.6", default-features = false, features = ["flac", "wav", "pcm", "mp3", "aac", "isomp4", "alac", "vorbis", "ogg", "aiff"] }

# ALSA is loaded at runtime (libasound.so.2), no build-time headers
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_UI_Shell_PropertiesSystem",
] }
